<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Troye Sivan Jellyfin Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Troye Sivan Jellyfin Client</h1>
    <div id="auth">
      <input id="server" placeholder="Jellyfin Server URL" />
      <input id="apikey" placeholder="API Key" />
      <button id="loginButton">Bloom</button>
    </div>
    <div id="content" class="hidden">
      <button id="fetchButton">Dive Into Library</button>
      <button id="backButton" class="hidden">Back</button>
      <ul id="libraryList"></ul>
      <ul id="itemList" class="hidden"></ul>
      <div id="player" class="hidden"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
